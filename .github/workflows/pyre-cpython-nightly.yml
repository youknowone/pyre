name: pyre CPython suite (nightly)

# Non-gating exploratory run of the FULL CPython regression suite (every
# module, including ones that fail today) across three lanes:
#   * dynasm, JIT on   — the gating backend, full picture.  DAILY.
#   * dynasm, JIT off  — interpreter baseline; a module that passes here but
#     not under JIT is a JIT correctness divergence.  WEEKLY.
#   * cranelift, JIT on.  WEEKLY.
# Only the first runs every night: it is the one that answers whether a
# recorded verdict has gone stale, and 434 modules three times a day buys
# little the week does not.  A manual dispatch runs all three.
# Reports are uploaded as artifacts so coverage growth and JIT divergence can
# be tracked over time. This never gates a PR: `--full` reports a regression
# against the baseline instead of failing on it. It is not the same as always
# exiting 0 -- a run whose buckets do not account for every module it selected
# still fails, and withholds its report, because that summary is short of a
# result rather than carrying a bad one.

on:
  schedule:
    # Daily, the gating configuration alone. That one lane is what answers
    # "has a recorded verdict gone stale", which is the question the
    # non-`PASS` rows can only be asked here.
    - cron: "0 7 * * *"
    # Weekly, all three. The JIT-divergence comparison and the cranelift
    # picture are worth a full run, not worth 434 modules three times every
    # night.
    - cron: "0 8 * * 0"
  workflow_dispatch:

concurrency:
  group: pyre-cpython-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-suite:
    name: full CPython suite (linux)
    # The gate runs on ubuntu-24.04 and the baseline records its verdicts, so
    # the exploratory lanes run there too: a report from another host measures
    # host divergence on top of the coverage it is meant to show, and the JIT
    # codegen is arch-specific besides. Each lane is spelled with the gate's
    # own `--jobs` and `--timeout` for the same reason -- a module the report
    # calls TIMEOUT under a tighter budget than the baseline was recorded with
    # is not a finding about the module.
    runs-on: ubuntu-24.04
    # A ceiling, not a cost: the daily run is one lane and ends well inside
    # it. It has to cover the weekly worst case -- the LLBC extract, both
    # backend builds, and three full 434-module lanes -- because the 120 this
    # job carried before covered none of it. Over the eight nights preceding
    # this change not one run finished all three lanes: three were cut off
    # inside the cranelift lane, three inside the lane before it, and two
    # never got past the first.
    timeout-minutes: 300
    env:
      PYRE_SHARED_BUILD: ${{ github.workspace }}/.pyre-build
      CHARON_VERSION: nightly-2026.05.29
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    - name: Set up CPython
      id: cpython
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.14"
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        cache-bin: false
    - name: Cache Charon binary
      id: charon-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          .pyre-build/charon
          .pyre-build/charon-src
        key: charon-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.CHARON_VERSION }}
        restore-keys: |
          charon-bin-${{ runner.os }}-${{ runner.arch }}-
    - name: Install Charon
      if: steps.charon-cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/install-charon.py
    - name: Compute LLBC fingerprint
      id: llbc-fingerprint
      shell: bash
      run: |
        value="$(scripts/extract-llbc.py --fingerprint majit-rlib pyre-object pyre-interpreter pyre-jit)"
        echo "value=${value}" >> "$GITHUB_OUTPUT"
    - name: Cache LLBC
      id: llbc-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: build/llbc
        key: llbc-${{ runner.os }}-${{ runner.arch }}-${{ env.CHARON_VERSION }}-${{ steps.llbc-fingerprint.outputs.value }}
        # The exact key misses whenever any of the four crates moved, which is
        # most nights, and without a prefix to fall back on a miss restores
        # nothing at all -- so the whole extract ran from scratch every time,
        # ~23 minutes of a budget that had none to give. The key only chooses
        # what gets offered: `extract-llbc.py` re-adjudicates each crate
        # against the current tree and re-extracts the ones that moved, so a
        # loose restore cannot hand the build a stale artefact.
        restore-keys: |
          llbc-${{ runner.os }}-${{ runner.arch }}-${{ env.CHARON_VERSION }}-
    - name: Extract LLBC
      if: steps.llbc-cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/extract-llbc.py majit-rlib pyre-object pyre-interpreter pyre-jit
    - name: Build the dynasm backend
      id: build-dynasm
      run: cargo build --release -p pyrex --bin pyre-dynasm --no-default-features --features dynasm
    - name: Build the cranelift backend
      id: build-cranelift
      # Carries the same schedule predicate as the lane that uses it: the daily
      # run never invokes this binary, so building it there spends the time for
      # nothing.
      #
      # `!cancelled()` for the same reason the lanes carry it. The two backends
      # share the sources but not the feature set, so one can break while the
      # other builds -- and under the implicit `success()` a dynasm-only break
      # skipped this build, which skipped the cranelift lane after it, costing
      # the night a backend report it could have had. What it gives up is that
      # a failed step in the setup above no longer stops this build from
      # starting; it fails on its own, on a run that was already red.
      if: ${{ !cancelled() && github.event.schedule != '0 7 * * *' }}
      run: cargo build --release -p pyrex --bin pyre-cranelift --no-default-features --features cranelift
    # Each lane names the build whose binary it runs and nothing else, so no
    # lane depends on where the other builds and lanes sit in the list. The
    # implicit `success()` this replaces did depend on it: it skipped this
    # lane, the one that runs every night, whenever the cranelift build above
    # it failed -- even though the binary this lane runs had built fine.
    - name: dynasm (JIT on)
      if: ${{ !cancelled() && steps.build-dynasm.outcome == 'success' }}
      run: ${{ steps.cpython.outputs.python-path }} pyre/cpython_tests/run.py --full --backend dynasm --jobs 3 --timeout 300 --report reports/dynasm-jit.json
    # These two run on the weekly schedule and on a manual dispatch, not every
    # night. The condition names the DAILY cron and excludes it, rather than
    # naming the weekly one and requiring it: a dispatch has no
    # `github.event.schedule` at all, so a positive test would skip these on
    # exactly the run a human asked for -- and would do it silently.
    #
    # `!cancelled()` rather than the implicit `success()` is the other half: a
    # lane exits nonzero on more than a regression -- `--full` gates none of
    # those, but a summary short of the modules it selected still returns 1 --
    # and without it the JIT-divergence comparison this pair exists to produce
    # is lost to whichever lane happened to run first. What that must not also
    # buy is a lane running without the binary it needs -- hence the build
    # outcome beside it: dropping `success()` is about the lane before, not
    # about the build.
    - name: dynasm (JIT off)
      if: ${{ !cancelled() && steps.build-dynasm.outcome == 'success' && github.event.schedule != '0 7 * * *' }}
      run: ${{ steps.cpython.outputs.python-path }} pyre/cpython_tests/run.py --full --backend dynasm --no-jit --jobs 3 --timeout 300 --report reports/dynasm-nojit.json
    # A skipped step's outcome is `skipped`, not `success`, so requiring the
    # build to have succeeded already carries the schedule predicate with it.
    - name: cranelift (JIT on)
      if: ${{ !cancelled() && steps.build-cranelift.outcome == 'success' }}
      run: ${{ steps.cpython.outputs.python-path }} pyre/cpython_tests/run.py --full --backend cranelift --jobs 3 --timeout 300 --report reports/cranelift-jit.json
    - name: Upload reports
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cpython-suite-reports
        path: reports/
