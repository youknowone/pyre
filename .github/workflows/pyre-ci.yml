name: pyre CI

on:
  push:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "majit/**/*"
      - "pyre/**/*"
      - "lib-python/**"
      - "scripts/install-charon.py"
      - "scripts/extract-llbc.py"
      # The engine `extract-llbc.py` imports; most of the extraction logic
      # lives here, so a change to it alone must still trigger this workflow.
      - "scripts/llbc_extract.py"
      - ".github/workflows/pyre-ci.yml"
  pull_request:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "majit/**/*"
      - "pyre/**/*"
      - "lib-python/**"
      - "scripts/install-charon.py"
      - "scripts/extract-llbc.py"
      - "scripts/llbc_extract.py"
      - ".github/workflows/pyre-ci.yml"
  workflow_dispatch:

concurrency:
  # A PR's runs supersede each other — only the tip matters there. A push to a
  # tracked branch must not be, or a merge train cancels every predecessor's run
  # and the branch goes unverified: keying those by SHA gives each landed commit
  # its own group, so nothing cancels and a red commit is attributable to itself.
  group: pyre-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-fmt:
    name: cargo fmt --check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: rustfmt
    - name: Run cargo fmt --check
      run: cargo fmt --all -- --check

  rustdoc-links:
    name: rustdoc links (ratcheted crate list)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    - name: cargo doc -D warnings on the cleared crates
      # A RATCHET, not a flat gate, and the distinction is load-bearing.
      #
      # Nothing in this repository ran `cargo doc` before this job, so rustdoc's
      # warn-by-default lints have never been read: when this job landed
      # (4cd2cc56813) the 12 majit crates carried 400 warnings — 217
      # `unresolved link`, 175 `private_intra_doc_links`, 8
      # `invalid_html_tags`. That census is dated, not current. A workspace-wide
      # `-D warnings` would therefore be red the day it lands, and a gate that is
      # red on arrival gets `continue-on-error`'d or deleted rather than fixed.
      #
      # So this grades only the crates already at zero. To extend it: clear a
      # crate, add its `-p` flag below, and that zero is locked in permanently.
      # THIS LIST IS THE PROGRESS RECORD — a note elsewhere would rot, a `-p`
      # flag cannot, because removing one is a visible diff.
      #
      # ⚠ A lint level is only half a gate; the other half is something that runs
      # the tool. `[lints.rustdoc] … = "deny"` in a Cargo.toml would still be
      # inert here, because no job invoked rustdoc at all. That is why the level
      # lives in this job's env and not in the manifests.
      #
      # `--no-deps` keeps the verdict about this workspace's own doc comments; a
      # dependency's warnings are not ours to fix and would make the gate hostage
      # to a version bump. `--locked` because `Cargo.lock` is the first entry of
      # the LLBC closure and a lockfile rewrite stales every extracted artefact.
      #
      # ⚠ SCOPE OF THE ZERO — THE THREE LINT FAMILIES DO NOT HAVE EQUAL REACH,
      # so "this crate is clean" means different things for each. Measured by
      # mutation on a private struct field and a `pub fn` one file apart:
      #
      #   invalid_html_tags        fires on private items      ⇒ whole crate
      #   broken_intra_doc_links   does NOT fire on private     ⇒ public only
      #   private_intra_doc_links  is by definition public-doc  ⇒ public only
      #
      # Link resolution runs only for items rustdoc renders, and it does not
      # render private items without a flag; the HTML lint reads every doc
      # comment it parses. So the unresolved-link zero below covers the public
      # API and nothing more: the crates listed below read 0/0/0 here, while
      # behind `--document-private-items` there is a real ungraded population.
      # ⚠ THAT POPULATION'S SIZE IS DATED AND ITS SCOPE HAS SINCE MOVED. The
      # recorded 18 unresolved + 2 private-item links were measured over the
      # FOUR crates this job shipped with; `majit-metainterp` joined the list
      # afterwards (0f76048be00) and was never folded into that figure, so the
      # number for the current list is UNMEASURED rather than 20. Re-measure
      # before citing it. Adding the flag is the obvious extension and is
      # deliberately NOT taken, because it would make this job red the day it
      # lands — the one property the ratchet exists to avoid.
      #
      # ⛔ Do not restate the CURRENT crate count in this comment. It drifted
      # once already (the prose said "four" while the list below had grown to
      # five); the `-p` list is the only statement of it that cannot go stale.
      # Naming the count a past measurement was taken over is fine and is done
      # above — that number describes a population, not the list.
      #
      # ARMED, not assumed — every claim above is a mutation that moved the rc:
      #   pub fn + unresolved link      (majit-trace)   rc=101
      #   public doc -> private item    (majit-macros)  rc=101
      #   private field + `Vec<u8>`     (majit-trace)   rc=101  (HTML lint)
      #   private field + broken link   (majit-trace)   rc=0    ⇐ the blind spot
      # All four mutants reverted; the clean run documents every crate in the
      # list below and returns 0. (Those four arms were taken over the four
      # crates the job shipped with, so they do not cover the later additions.)
      env:
        RUSTDOCFLAGS: -D warnings
      run: |
        cargo doc --no-deps --locked \
          -p majit-rlib \
          -p majit-backend-cranelift \
          -p majit-trace \
          -p majit-macros \
          -p majit-metainterp

  backend-edge:
    name: backend-edge (every metainterp dependent selects a backend)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    # No cache and no build: the script only runs `cargo tree`/`cargo metadata`,
    # which resolve features WITHOUT running build scripts. That is the whole
    # design -- the defect it catches is a feature-RESOLUTION failure, so it is
    # decided before any compilation, and this leg stays readable even when the
    # LLBC staleness gate is red. ~15s on 38 members.
    #
    # ⇒ It therefore needs NO `PYRE_LLBC_STRICT=0`. Measured 2026-08-10 with the
    # env unset, in both states a runner can present: with all four `build/llbc`
    # stamps stale (the tree-wide RC=101 state) and on a fresh checkout with no
    # `build/llbc` at all -- 24/14/0 and RC=0 in both, creating no artefacts.
    #
    # ⛔ AND THE COST OF THAT: a green run here does NOT mean the workspace
    # compiles. This leg never builds anything. Do not read it as a smoke test,
    # and do not "fix" a red compile job by pointing at this one being green.
    #
    # ⚠ Deliberately NOT folded into an existing job: every other leg that
    # touches cargo passes `--no-default-features --features dynasm`, which
    # supplies a backend workspace-wide and is exactly what hides this defect.
    - name: Check the backend-default edge
      run: scripts/check-backend-edge.py

  prepare-charon-llbc-linux:
    name: prepare Charon/LLBC (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env: &charon-llbc-env
      # Redirect the shared charon/ullbc build dir INTO the workspace so
      # actions/cache can reach it. Locally PYRE_SHARED_BUILD is unset and
      # both scripts default to ../.pyre-build (shared across worktrees).
      PYRE_SHARED_BUILD: ${{ github.workspace }}/.pyre-build
      # Single source of truth for the pinned charon tag. MUST mirror
      # CHARON_VERSION_DEFAULT in scripts/install-charon.py: it drives both
      # the cache keys below AND install-charon.py's .installed-version
      # stamp, so a pin bump here misses the cache and re-installs.
      CHARON_VERSION: nightly-2026.05.29
    steps: &prepare-charon-llbc-steps
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Check the LLBC fingerprint input walk
      # Ahead of the Charon install so a regression reports in seconds. An
      # `include*!` spelling the walk cannot resolve widens no digest and fails
      # nothing downstream — the artefact just reads as fresh — so this is the
      # only place that behaviour is observable. Needs no cargo and no git.
      shell: bash
      run: scripts/llbc_extract_selftest.py
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        cache-bin: false
        shared-key: ${{ runner.arch }}
        # Restore-only on PRs (they pull main's cache via restore-keys); save
        # only on main so per-PR target caches don't multiply across refs past
        # GitHub's 10 GB cache budget and trigger LRU eviction.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Cache Charon binary
      id: charon-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        # Only the installed charon/charon-driver + .installed-version stamp —
        # all the skip check (charon_bin + stamp) and the main build need.
        # The Windows from-source tree (.pyre-build/charon-src) is NOT cached:
        # it shares this key with the binary, so it never aids a miss (a miss
        # restores nothing and rebuilds fully regardless) and only bloats the
        # entry against the repo-wide 10 GB cache budget.
        path: .pyre-build/charon
        key: charon-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.CHARON_VERSION }}
        restore-keys: |
          charon-bin-${{ runner.os }}-${{ runner.arch }}-
    - name: Install Charon
      # install-charon.py self-skips on a restored stamp; the guard also
      # avoids the network round-trip / from-source rebuild on an exact hit.
      if: steps.charon-cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/install-charon.py
    - name: Upload Charon artifact
      # Hand the installed Charon tree to downstream jobs within this run.
      # The cache above is still the cross-run source of truth; this artifact
      # avoids late consumer jobs depending on a second cache restore.
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: charon-${{ runner.os }}-${{ runner.arch }}
        path: .pyre-build/charon
        retention-days: 1
        include-hidden-files: true
        if-no-files-found: error
    - name: Compute LLBC fingerprints
      id: llbc-fingerprint
      shell: bash
      # One fingerprint per Charon target crate, over that crate's own local
      # path-dependency source closure (not broad pyre/** or majit/** globs).
      # Per-crate so a change confined to one crate's closure only re-extracts
      # that crate, via the split caches below. extract-llbc.py drops
      # majit-translate from the pyre-object/-interpreter fingerprints — their
      # .ullbc holds zero majit-translate content (it re-asserts this on every
      # extraction) — so a translator-only edit reuses those two artefacts;
      # pyre-jit keeps majit-translate because its .ullbc embeds those types.
      run: |
        for crate in majit-rlib pyre-object pyre-interpreter pyre-jit; do
          value="$(scripts/extract-llbc.py --fingerprint "$crate")"
          echo "${crate//-/_}=${value}" >> "$GITHUB_OUTPUT"
        done
    # Per-crate caches (per-OS/arch because cfg(target_os)/cfg(target_arch)
    # bodies differ). Splitting the former single build/llbc entry lets the
    # unchanged crates restore while only the changed crate re-extracts; the
    # Extract step below refills any missed crate, so the downstream artefact
    # always carries the whole ullbc set.
    #
    # Each crate's entry also carries its `*.layouts.ullbc` sidecars — the
    # same crate re-extracted for a cross target and reduced to its type
    # declarations, so a wasm32 build reads wasm32 field offsets rather than
    # the extraction host's. They must restore alongside the artefact they
    # accompany: a cache hit skips extraction, and `pyre-jit-trace`'s build
    # script refuses a cross-target build whose sidecars are absent.
    - name: Cache LLBC (majit-rlib)
      id: llbc-cache-rlib
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          build/llbc/majit-rlib.ullbc
          build/llbc/majit-rlib.ullbc.fingerprint
          build/llbc/majit-rlib.*.layouts.ullbc
        key: llbc-majit-rlib-${{ runner.os }}-${{ runner.arch }}-${{ env.CHARON_VERSION }}-${{ steps.llbc-fingerprint.outputs.majit_rlib }}
    - name: Cache LLBC (pyre-object)
      id: llbc-cache-object
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          build/llbc/pyre-object.ullbc
          build/llbc/pyre-object.ullbc.fingerprint
          build/llbc/pyre-object.*.layouts.ullbc
        key: llbc-pyre-object-${{ runner.os }}-${{ runner.arch }}-${{ env.CHARON_VERSION }}-${{ steps.llbc-fingerprint.outputs.pyre_object }}
    - name: Cache LLBC (pyre-interpreter)
      id: llbc-cache-interpreter
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          build/llbc/pyre-interpreter.ullbc
          build/llbc/pyre-interpreter.ullbc.fingerprint
          build/llbc/pyre-interpreter.*.layouts.ullbc
        key: llbc-pyre-interpreter-${{ runner.os }}-${{ runner.arch }}-${{ env.CHARON_VERSION }}-${{ steps.llbc-fingerprint.outputs.pyre_interpreter }}
    - name: Cache LLBC (pyre-jit)
      id: llbc-cache-jit
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          build/llbc/pyre-jit.ullbc
          build/llbc/pyre-jit.ullbc.fingerprint
        key: llbc-pyre-jit-${{ runner.os }}-${{ runner.arch }}-${{ env.CHARON_VERSION }}-${{ steps.llbc-fingerprint.outputs.pyre_jit }}
    - name: Extract LLBC
      # Runs only when some crate's cache missed. extract-llbc.py self-skips
      # the crates whose .ullbc + matching .fingerprint stamp were restored
      # above, so only the changed crate(s) recompile.
      if: >-
        steps.llbc-cache-rlib.outputs.cache-hit != 'true' ||
        steps.llbc-cache-object.outputs.cache-hit != 'true' ||
        steps.llbc-cache-interpreter.outputs.cache-hit != 'true' ||
        steps.llbc-cache-jit.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/extract-llbc.py majit-rlib pyre-object pyre-interpreter pyre-jit
    - name: Upload LLBC artifact
      # Hand the ullbc set (freshly extracted, or restored from the cache
      # above) to the downstream jobs as a run-scoped artifact. Unlike
      # actions/cache, an artifact is exempt from the repo-wide 10 GB cache
      # budget and its LRU eviction, so a small ullbc set cannot be evicted
      # between this job and a late-scheduled consumer. The LLBC cache above
      # is kept only to skip re-extraction across runs.
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: llbc-${{ runner.os }}-${{ runner.arch }}
        path: build/llbc
        retention-days: 1
        if-no-files-found: error

  prepare-charon-llbc-macos:
    name: prepare Charon/LLBC (macos-latest)
    runs-on: macos-latest
    env: *charon-llbc-env
    steps: *prepare-charon-llbc-steps

  prepare-charon-llbc-windows:
    name: prepare Charon/LLBC (windows-latest)
    # On windows-latest install-charon.py builds Charon from source
    # (no Windows release asset is published); see scripts/install-charon.py.
    runs-on: windows-latest
    env: *charon-llbc-env
    steps: *prepare-charon-llbc-steps

  cargo-test-linux:
    name: cargo test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    needs: prepare-charon-llbc-linux
    if: ${{ !cancelled() && needs.prepare-charon-llbc-linux.result == 'success' }}
    env:
      # See prepare-charon-llbc: downstream jobs download the prepared Charon
      # artifact into this workspace path.
      PYRE_SHARED_BUILD: ${{ github.workspace }}/.pyre-build
      CHARON_VERSION: nightly-2026.05.29

    steps: &cargo-test-steps
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        cache-bin: false
        shared-key: ${{ runner.arch }}
        # Restore-only on PRs (they pull main's cache via restore-keys); save
        # only on main so per-PR target caches don't multiply across refs past
        # GitHub's 10 GB cache budget and trigger LRU eviction.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Download Charon artifact
      # Run-scoped handoff from prepare-charon-llbc. Cross-run reuse still
      # comes from the prepare job's cache; consumers avoid cache eviction
      # races by downloading the prepared install tree directly.
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: charon-${{ runner.os }}-${{ runner.arch }}
        path: .pyre-build/charon
    - name: Restore Charon executable permissions (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: chmod +x .pyre-build/charon/*/charon .pyre-build/charon/*/charon-driver
    - name: Download LLBC artifact
      # Run-scoped handoff from prepare-charon-llbc. Unlike actions/cache,
      # an artifact is exempt from the repo-wide 10 GB cache budget and its
      # LRU eviction, so a small ullbc set cannot vanish between prepare and
      # a late-scheduled consumer (the macOS legs start well after the
      # Linux/Windows legs — long enough for a cached entry to be evicted).
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: llbc-${{ runner.os }}-${{ runner.arch }}
        path: build/llbc
    - name: Verify prepared Charon/LLBC
      shell: bash
      run: |
        test -d .pyre-build/charon
        test -s build/llbc/majit-rlib.ullbc
        test -s build/llbc/pyre-object.ullbc
        test -s build/llbc/pyre-interpreter.ullbc
        test -s build/llbc/pyre-jit.ullbc
    - name: Free up runner disk space
      if: runner.os == 'Linux'
      shell: bash
      # `cargo test --all` builds every workspace member, and the majit
      # demo interpreters (tlr/tl/tla/tiny2/tiny3/tinyframe/braininterp/
      # tlc/calc) plus the wasm crates each statically link the full
      # selected backend. On the cranelift leg those extra binaries
      # overflow the ubuntu runner's default free disk during the link
      # (`No space left on device` -> ld terminates with SIGBUS). Reclaim
      # the preinstalled toolchains CI never uses (~20+ GB) so the whole
      # workspace's tests build and run instead of excluding crates.
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost
        sudo docker image prune --all --force || true
        df -h /
    - name: Build test binaries (dynasm)
      shell: bash
      # Compile the test targets as their own step, so a build break and a test
      # failure are DIFFERENT red steps.
      #
      # Why this is not redundant with the step below: `cargo test` compiles and
      # runs in one command, and if compilation fails it prints no `test result:`
      # line at all. The job goes red for the build error, and every test brake in
      # the workspace — each one written to fail loudly on a real regression — is
      # then indistinguishable in the log from a brake that passed. Measured: run
      # 31313527437 died on one `E0063` in `majit-metainterp (lib test)` and
      # emitted ZERO test results on all three hosts, so nothing the suite checks
      # was actually checked, on any of them.
      #
      # With this step green, the next step's result is a statement about tests.
      # Costs no extra compile time: the run below reuses these artifacts.
      run: cargo test --all --no-run --no-default-features --features dynasm

    - name: Run cargo tests (dynasm)
      shell: bash
      # Only ONE full-workspace run. The dynasm pass runs the whole workspace
      # (--all): that is the single run of every
      # backend-independent crate's tests (majit-translate/-ir/-gc/-macros/
      # -trace, pyre-object/-native/-module, the backend crates' own tests, …).
      # None of those are gated by the dynasm/cranelift feature, so re-running
      # them under cranelift only reproduced byte-identical results while
      # relinking ~15 extra test binaries (the majit-translate harness alone
      # links >2900 tests).
      run: cargo test --all --no-default-features --features dynasm

    - name: Build test binaries (cranelift)
      shell: bash
      # Same split as the dynasm leg above: compile first, so this leg's red
      # means "does not build" and the next step's red means "tests failed".
      # The crate list is kept identical to the run below — a build step that
      # covers a different set than the step it vouches for is worse than none,
      # because it certifies something nobody is about to run.
      run: |
        cargo test --no-run --no-default-features --features cranelift \
          -p majit-metainterp -p majit-backend-cranelift \
          -p pyre-jit -p pyre-jit-trace -p pyrex -p pyre-interpreter -p majit \
          -p tlr -p tl -p tla -p tiny2 -p tiny3 -p tinyframe \
          -p braininterp -p dualtape -p tlc -p calc -p i64env -p spcount -p cel

    - name: Run cargo tests (cranelift)
      shell: bash
      # This is a separate step so GitHub reports and reruns the backend passes
      # independently. Steps remain in one job, in order, so this pass starts
      # only after dynasm finishes and reuses that pass's Cargo target cache.
      # Re-run ONLY the crates whose test outcome depends on the active JIT
      # backend — the metainterp /
      # pyre-jit / pyre-jit-trace / pyrex stack, the interpreter, the cranelift
      # backend crate, and the majit example interpreters (each selects the
      # backend through `majit-metainterp/{dynasm,cranelift}`). Test EXECUTION is
      # cheap (~7s for the whole workspace); the cost this avoids is the second
      # backend's compile+link of those otherwise-identical harnesses.
      #
      # ⚠ `-p cel` here is a COMPILE CHECK ONLY and runs zero cel tests. All five
      # of cel's gates self-ignore under `debug_assertions` (they compare
      # wrapping i64 and bit-exact float results, which a debug profile panics
      # on), and this leg — like the dynasm leg above — is debug. The gates run
      # in the release step below, which is dynasm-only, so no cel gate is
      # exercised under cranelift anywhere in CI. Keeping `-p cel` is still worth
      # it: it is what catches a cranelift-only compile break in the crate.
      run: |
        cargo test --no-default-features --features cranelift \
          -p majit-metainterp -p majit-backend-cranelift \
          -p pyre-jit -p pyre-jit-trace -p pyrex -p pyre-interpreter -p majit \
          -p tlr -p tl -p tla -p tiny2 -p tiny3 -p tinyframe \
          -p braininterp -p dualtape -p tlc -p calc -p i64env -p spcount -p cel

    - name: Run cel's release-only probe gates (Linux only)
      # cel's five gate tests self-ignore under `debug_assertions` — they compare
      # wrapping i64 and bit-exact float results across a clean interpreter, a
      # JIT-off run and a JIT-on run, and a debug profile panics on the overflow
      # instead of wrapping — so both `cargo test` steps above report them
      # `ignored`. This is the step that runs them, and it is the only one: left
      # unrun the crate is back where it was before it had tests, which is unable
      # to fail a test run, only now with a green badge over it. The precedent
      # this copies (the dispatcher-graph step in the pyre/check.py job) records
      # what that costs: "left unrun it rots".
      #
      # Only the gate halves run here; each probe's timing loops stay in the
      # binary (`cargo run -p cel --release`), where `probe` alone times nine
      # interleaved rounds over 20M rows. The gates take under a second.
      #
      # Linux only, and dynasm only, because what this buys over the two steps
      # above is a release profile, and paying for one on three hosts times two
      # backends is four more release builds of the majit stack for the same
      # assertions. A backend-specific miscompile on cranelift is not covered.
      if: runner.os == 'Linux'
      run: cargo test --release -p cel --no-default-features --features dynasm

  cargo-test-macos:
    name: cargo test (macos-latest)
    runs-on: macos-latest
    needs: prepare-charon-llbc-macos
    if: ${{ !cancelled() && needs.prepare-charon-llbc-macos.result == 'success' }}
    env:
      PYRE_SHARED_BUILD: ${{ github.workspace }}/.pyre-build
      CHARON_VERSION: nightly-2026.05.29
    steps: *cargo-test-steps

  cargo-test-windows:
    name: cargo test (windows-latest)
    runs-on: windows-latest
    needs: prepare-charon-llbc-windows
    if: ${{ !cancelled() && needs.prepare-charon-llbc-windows.result == 'success' }}
    env:
