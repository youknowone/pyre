[package]
name = "tl"
version.workspace = true
edition.workspace = true
publish = false

[features]
cranelift = ["majit-metainterp/cranelift"]
dynasm = ["majit-metainterp/dynasm"]

[dependencies]
linkme = { workspace = true }
parking_lot = { workspace = true }
# `set_gc_allocator` panics unless `gc_box` is on (`note_gc_box_installed`).
majit-gc = { workspace = true, features = ["gc_box"] }
majit-ir = { workspace = true }
majit-metainterp = { workspace = true }
majit-macros = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ctor = { workspace = true }
