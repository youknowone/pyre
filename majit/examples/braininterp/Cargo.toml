[package]
name = "braininterp"
version.workspace = true
edition.workspace = true
publish = false

[features]
cranelift = ["majit-metainterp/cranelift"]
dynasm = ["majit-metainterp/dynasm"]

[dependencies]
parking_lot = { workspace = true }
majit-ir = { workspace = true }
majit-macros = { workspace = true }
# `install_jitframe_gc` is compiled only with `gc_box` (`note_gc_box_installed`).
majit-metainterp = { workspace = true, features = ["gc_box"] }
