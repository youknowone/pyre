[package]
name = "majit-backend-cranelift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cranelift code generation backend for majit JIT compiler"

[features]
# A measurement arm, never a shipping one. It adds one run-time selectable loop
# to `run_compiled_code_inner` that repeats the frame allocation and the input
# argument writes into a frame nothing enters, so the repeatable PREFIX of a
# compiled entry's call can be priced against the call it prefixes. Off by
# default; the count it reads lives in `majit_backend::deadframe`.
execute-stage-probe = []

[dependencies]
indexmap = { workspace = true }
majit-ir = { workspace = true }
majit-backend = { workspace = true }
majit-translate = { workspace = true }
majit-gc = { workspace = true }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-module = { workspace = true }
cranelift-native = { workspace = true }
target-lexicon = { workspace = true }
parking_lot = { workspace = true }
region = { workspace = true }

[dev-dependencies]
majit-gc = { workspace = true, features = ["gc_box"] }
majit-ir = { workspace = true, features = ["test-support"] }
smallvec = { workspace = true }
