# Learn more about this config here: https://pre-commit.com/

# To enable these pre-commit hooks run:
# `pipx install pre-commit` or `brew install pre-commit`
# Then in the project root directory run `pre-commit install`

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: ["--toml=pyproject.toml"]
        types: [rst]
        additional_dependencies:
          - tomli

  - repo: local
    hooks:
      - id: no-line-number-citations
        name: upstream citations name a symbol, not a line number
        entry: python3 scripts/check-new-line-citations.py
        language: system
        pass_filenames: false
        # Reads the staged diff itself, so it judges what a commit ADDS. Under
        # `pre-commit run --all-files` that diff is empty and the hook is inert,
        # which is what keeps the tree's existing numbers out of scope.
        always_run: true
