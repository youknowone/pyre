[package]
name = "pyre-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native library backends for pyre, kept outside the LLBC extraction"

[features]
default = ["host_env"]
host_env = ["dep:rustpython-host_env"]
sandbox = ["host_env"]
wasm_vfs = ["dep:lz4_flex"]

[dependencies]
parking_lot = { workspace = true }
rustpython-common = { workspace = true, features = ["hashlib"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
# Platform trust-store loading is safe on every target. The rustls engine
# helpers (`ssl`) are native-only: enabling them here would feature-unify
# rustls into the wasm32 interpreter extract, and rustls-pki-types has no
# `UnixTime::now` on that target.
rustpython-host_env = { workspace = true, optional = true, features = ["native-certs"] }
libc = { workspace = true }
lz4_flex = { version = "0.13", default-features = false, features = [
    "safe-decode",
], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustpython-host_env = { workspace = true, optional = true, features = ["native-certs", "ssl"] }
rustls = { workspace = true }
rustls-webpki = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
pem-rfc7468 = { workspace = true }
der = { workspace = true }
pkcs8 = { workspace = true }
rustls-native-certs = { workspace = true }

[build-dependencies]
cc = "1.2"
lz4_flex = { version = "0.13", default-features = false, optional = true }
