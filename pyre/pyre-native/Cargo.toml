[package]
name = "pyre-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native library backends for pyre, kept outside the LLBC extraction"

[features]
default = ["host_env"]
host_env = ["dep:rustpython-host_env"]
sandbox = ["host_env"]
wasm_vfs = ["dep:lz4_flex"]

[dependencies]
parking_lot = { workspace = true }
rustpython-common = { workspace = true, features = ["hashlib"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
# `_ssl` shares the rustls engine helpers (bio, cert, cipher, chain, msg,
# provider) plus platform trust-store loading with RustPython. host_env-free
# builds keep the local copies in `ssl.rs`.
rustpython-host_env = { workspace = true, optional = true, features = ["native-certs", "ssl"] }
libc = { workspace = true }
lz4_flex = { version = "0.13", default-features = false, features = [
    "safe-decode",
], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true }
rustls-webpki = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
pem-rfc7468 = { workspace = true }
der = { workspace = true }
pkcs8 = { workspace = true }
rustls-native-certs = { workspace = true }

[build-dependencies]
cc = "1.2"
lz4_flex = { version = "0.13", default-features = false, optional = true }
